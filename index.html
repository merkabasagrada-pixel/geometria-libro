<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geometría y Diseño Divino — Enzo Emanuel Burga</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root {
    --gold: #c9a84c;
    --gold-light: #e8d48b;
    --gold-dark: #a07e2e;
    --bg: #0a0a0f;
    --text: #e8e6e1;
    --text-muted: #6b6963;
  }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ===== LOGIN SCREEN ===== */
  #login-screen {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    transition: opacity 0.6s ease;
  }
  #login-screen.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .login-box {
    text-align: center;
    padding: 3rem 2.5rem;
    border: 1px solid rgba(201, 168, 76, 0.15);
    border-radius: 8px;
    background: linear-gradient(135deg, rgba(201, 168, 76, 0.03), transparent);
    max-width: 380px;
    width: 90%;
  }

  .login-box svg {
    margin-bottom: 1.5rem;
    opacity: 0.3;
  }

  .login-box h1 {
    font-family: 'Cinzel', serif;
    font-size: 1.1rem;
    font-weight: 500;
    color: var(--gold);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }

  .login-box p {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-bottom: 2rem;
    letter-spacing: 0.05em;
  }

  .login-input {
    width: 100%;
    padding: 0.9rem 1rem;
    margin-bottom: 0.8rem;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(201, 168, 76, 0.15);
    border-radius: 4px;
    color: var(--text);
    font-size: 0.9rem;
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color 0.3s;
  }
  .login-input:focus {
    border-color: var(--gold);
  }
  .login-input::placeholder {
    color: var(--text-muted);
    opacity: 0.5;
  }

  .login-btn {
    width: 100%;
    padding: 0.9rem;
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold);
    font-family: 'Inter', sans-serif;
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.3s;
    margin-top: 0.5rem;
  }
  .login-btn:hover {
    background: rgba(201, 168, 76, 0.1);
  }

  .login-error {
    color: #c94c4c;
    font-size: 0.75rem;
    margin-top: 0.8rem;
    min-height: 1.2em;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .login-error.show {
    opacity: 1;
  }

  /* ===== BOOK CONTAINER ===== */
  #book-container {
    display: none;
  }
  #book-container.show {
    display: block;
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 500px) {
    .login-box { padding: 2rem 1.5rem; }
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

<!-- ===== LOGIN SCREEN ===== -->
<div id="login-screen">
  <div class="login-box">
    <svg width="50" height="50" viewBox="0 0 50 50" fill="none">
      <circle cx="25" cy="25" r="23" stroke="#c9a84c" stroke-width="0.5" opacity="0.4"/>
      <polygon points="25,5 45,18 45,38 25,45 5,38 5,18" stroke="#c9a84c" stroke-width="0.5" fill="none" opacity="0.3"/>
      <polygon points="25,45 5,12 45,12" stroke="#c9a84c" stroke-width="0.5" fill="none" opacity="0.2"/>
    </svg>
    <h1>Geometría y Diseño Divino</h1>
    <p>Ingresá para acceder al libro</p>
    <input type="text" id="username" class="login-input" placeholder="Usuario" autocomplete="off">
    <input type="password" id="password" class="login-input" placeholder="Contraseña" autocomplete="off">
    <button class="login-btn" onclick="login()">Entrar</button>
    <div class="login-error" id="login-error">Usuario o contraseña incorrectos</div>
  </div>
</div>

<!-- ===== BOOK ===== -->
<div id="book-container">
  <iframe id="book-frame" style="width:100%;height:100vh;border:none;display:block;"></iframe>
</div>

<script>
  const VALID_USER = 'geometriasdeluz';
  const VALID_PASS = 'geometriasagrada';

  function login() {
    const user = document.getElementById('username').value.trim().toLowerCase();
    const pass = document.getElementById('password').value.trim();
    const error = document.getElementById('login-error');

    if (user === VALID_USER && pass === VALID_PASS) {
      document.getElementById('login-screen').classList.add('hidden');
      const container = document.getElementById('book-container');
      container.classList.add('show');
      document.getElementById('book-frame').src = 'libro.html';
    } else {
      error.classList.add('show');
      document.getElementById('password').value = '';
    }
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') login();
  });
</script>

</body>
</html>
